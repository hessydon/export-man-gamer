function tx(s,x,y,z,c='#fff',a='center'){cx.font=z+'px Impact,"Arial Black",sans-serif';cx.textAlign=a;cx.lineWidth=z/5;cx.strokeStyle='#0f1b3d';cx.lineJoin='round';cx.strokeText(s,x,y);cx.fillStyle=c;cx.fillText(s,x,y)}

 for(let y=-60+o;y<H;y+=60){cx.beginPath();cx.moveTo(0,y);cx.lineTo(W,y);cx.stroke()}
